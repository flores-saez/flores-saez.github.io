<style>
/* Layout: quiet catalog. Plain header, one toolbar, a 4-column product grid that steps down to 2 on phones. */
:root {
  --bg: #ffffff;
  --ink: #161616;
  --muted: #6f6f6c;
  --line: #e6e6e3;
  --tile: #f3f3f1;
  --accent: #b3262e;
  --pine: #1f5a42;
  --t1: #f6e9e7;
  --t2: #e7efe9;
  --t3: #f4efe3;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Instrument Serif", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --ink: #ededeb; --muted: #9a9a96; --line: #2a2a29; --tile: #f3f3f1; --accent: #e8817f; --pine: #7fc4a2; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --ink: #ededeb; --muted: #9a9a96; --line: #2a2a29; --tile: #f3f3f1; --accent: #e8817f; --pine: #7fc4a2; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 72px;
  display: flex; flex-direction: column; gap: 24px;
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 6vw, 60px); line-height: 1; letter-spacing: -0.01em; }
header h1 em { color: var(--accent); }
header p { margin: 10px 0 0; color: var(--muted); }
.countdown { display: flex; align-items: baseline; gap: 8px; color: var(--muted); }
.countdown strong { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; color: var(--pine); font-variant-numeric: tabular-nums; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 12px; border-block: 1px solid var(--line); }
.left { position: relative; display: flex; align-items: center; gap: 16px; }
button, select { font: inherit; color: inherit; }
.btn { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn[aria-expanded="true"] { border-color: var(--ink); }
.btn .n { color: var(--muted); font-weight: 400; margin-left: 2px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.sort { display: flex; align-items: center; gap: 8px; color: var(--muted); }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; }

.panel {
  position: absolute; top: calc(100% + 13px); left: 0; z-index: 20;
  width: min(340px, calc(100vw - 32px)); max-height: min(72vh, 620px); overflow: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  box-shadow: 0 16px 32px -20px rgba(0,0,0,.35);
}
.panel fieldset { border: 0; margin: 0; padding: 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.panel legend { padding: 0; margin-bottom: 8px; font-weight: 600; }
.checks label { display: flex; align-items: center; gap: 10px; padding: 4px 0; cursor: pointer; }
.checks label span:first-of-type { flex: 1; }
.checks .n { color: var(--muted); font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
.hist span { flex: 1; background: var(--line); }
.hist span.on { background: var(--ink); }
.range { position: relative; height: 20px; }
.track { position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; margin-top: -1px; background: var(--line); }
.fill { position: absolute; top: 0; bottom: 0; background: var(--ink); }
.range input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; z-index: 2; }
.range input::-webkit-slider-runnable-track { background: none; }
.range input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); cursor: grab; }
.range input::-moz-range-thumb { pointer-events: auto; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); cursor: grab; }
.range input::-moz-range-track { background: none; }
.minmax { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); }
.money { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.money input { width: 100%; min-width: 0; border: 0; background: none; font: inherit; color: var(--ink); font-variant-numeric: tabular-nums; }
.money input:focus { outline: none; }
.money:focus-within { border-color: var(--ink); }
.panel-foot { position: sticky; bottom: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.apply { background: var(--ink); color: var(--bg); border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 500; }

.active { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: -12px; }
.pill { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
.pill:hover { border-color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Grid */
.grid { display: grid; gap: 40px 20px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.item { display: flex; flex-direction: column; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.photo { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: var(--tile); overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .35s ease; }
.photo img.contain { object-fit: contain; padding: 10%; mix-blend-mode: multiply; }
.photo img.cover { object-fit: cover; }
.nophoto { position: absolute; inset: 0; display: grid; place-items: center; padding: 12%; text-align: center; font-family: var(--display); font-style: italic; font-size: 28px; line-height: 1.1; color: #161616; }
.item:hover .photo img { transform: scale(1.04) rotate(-1.5deg); }
.info { display: flex; flex-direction: column; gap: 2px; }
.brand { color: var(--muted); font-size: 12px; }
.name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item:hover .name { text-decoration: underline; text-underline-offset: 3px; }
.price { font-family: var(--display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
.price .sale { color: var(--accent); }
.price s { color: var(--muted); font-size: 17px; text-decoration-thickness: 1px; }
.meta { color: var(--muted); font-size: 13px; }
.meta.note { color: var(--accent); }
.empty { color: var(--muted); padding: 32px 0; }
footer { color: var(--muted); font-size: 12px; }
:is(.btn, select, .item, .pill, .link, .apply, .range input):focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) {
  .wrap { padding-block: 28px 48px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
  .count { display: none; }
}
@media (prefers-reduced-motion: reduce) { .photo img { transition: none; } .item:hover .photo img { transform: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Alonso's <em>Christmas</em> List</h1>
      <p>Tap any item to open it in the store.</p>
    </div>
    <div class="countdown" id="countdown" hidden><strong id="days"></strong><span id="daysLabel">days to Christmas</span></div>
  </header>

  <div class="toolbar">
    <div class="left">
      <button class="btn" id="filterBtn" type="button" aria-expanded="false" aria-controls="filterPanel">Filter<span class="n" id="fCount" hidden></span></button>
      <span class="count" id="resultCount"></span>
      <div class="panel" id="filterPanel" role="dialog" aria-label="Filter" hidden>
        <fieldset><legend>Category</legend><div class="checks" id="catList"></div></fieldset>
        <fieldset>
          <legend>Price</legend>
          <div class="hist" id="hist" aria-hidden="true"></div>
          <div class="range">
            <div class="track"><div class="fill" id="fill"></div></div>
            <input type="range" id="pMin" min="0" max="400" step="5" value="0" aria-label="Minimum price">
            <input type="range" id="pMax" min="0" max="400" step="5" value="400" aria-label="Maximum price">
          </div>
          <div class="minmax">
            <label class="money" for="pMinNum">$<input type="number" id="pMinNum" min="0" max="400" step="5" inputmode="numeric" aria-label="Minimum price"></label>
            <span>to</span>
            <label class="money" for="pMaxNum">$<input type="number" id="pMaxNum" min="0" max="400" step="5" inputmode="numeric" aria-label="Maximum price"></label>
          </div>
        </fieldset>
        <div class="panel-foot">
          <button class="link" id="clearBtn" type="button">Clear</button>
          <button class="apply" id="applyBtn" type="button">Show</button>
        </div>
      </div>
    </div>
    <label class="sort" for="sortBy">Sort
      <select id="sortBy">
        <option value="list">Default</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </label>
  </div>
  <div class="active" id="active" hidden></div>

  <main class="grid" id="grid" aria-live="polite"></main>
  <p class="empty" id="empty" hidden>No items match these filters.</p>
  <footer>Prices may have changed since this list was made. Thank you!</footer>
</div>

    url: "https://www.wrangler.com/shop/wrangler-x-roa-volano-denim-jacket-in-dark-owl-camo-112391364.html" }
].map((it, i) => ({ ...it, order: i }));
// Shuffle once per visit so no item always sits at the top.
for (let i = ITEMS.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ITEMS[i], ITEMS[j]] = [ITEMS[j], ITEMS[i]]; }

const CATS = [...new Set(ITEMS.map(i => i.cat))].sort();
const PMAX = 400, BIN = 20, NBINS = PMAX / BIN;
const state = { cats: new Set(), min: 0, max: PMAX, sort: "list" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inCats = i => !state.cats.size || state.cats.has(i.cat);
const inPrice = i => i.price == null ? !rangeSet() : i.price >= state.min && i.price <= state.max;
const money = p => "$" + (Number.isInteger(p) ? p : p.toFixed(2));
const rangeSet = () => state.min > 0 || state.max < PMAX;

function renderFilters() {
  $("catList").innerHTML = CATS.map(c => `<label><input type="checkbox" data-cat="${esc(c)}" ${state.cats.has(c) ? "checked" : ""}><span>${esc(c)}</span><span class="n" data-count="${esc(c)}"></span></label>`).join("");
  renderPrice();
}
function renderPrice() {
  document.querySelectorAll("#catList [data-count]").forEach(el => {
    el.textContent = ITEMS.filter(i => i.cat === el.dataset.count && inPrice(i)).length;
  });
  const pool = ITEMS.filter(i => inCats(i) && i.price != null);
  const bins = Array.from({ length: NBINS }, (_, b) => pool.filter(i => Math.min(Math.floor(i.price / BIN), NBINS - 1) === b).length);
  const top = Math.max(1, ...bins);
  $("hist").innerHTML = bins.map((n, b) => {
    const lo = b * BIN, hi = lo + BIN, on = lo <= state.max && hi > state.min;
    return `<span class="${on ? "on" : ""}" style="height:${n ? 12 + 88 * n / top : 3}%" title="$${lo}–$${hi}: ${n}"></span>`;
  }).join("");
  $("pMin").value = state.min; $("pMax").value = state.max;
  $("pMinNum").value = state.min; $("pMaxNum").value = state.max;
  $("fill").style.left = (state.min / PMAX * 100) + "%";
  $("fill").style.right = (100 - state.max / PMAX * 100) + "%";
  $("pMin").style.zIndex = state.min > PMAX - 25 ? 3 : 2;
}
function renderActive() {
  const pills = [];
  state.cats.forEach(c => pills.push(["cat", c, c]));
  if (rangeSet()) pills.push(["price", "", `$${state.min}–$${state.max}`]);
  $("active").innerHTML = pills.map(([k, v, t]) => `<button type="button" class="pill" data-k="${k}" data-v="${esc(v)}">${esc(t)} ×<span class="sr"> remove</span></button>`).join("")
    + (pills.length ? `<button type="button" class="link" data-k="all">Clear</button>` : "");
  $("active").hidden = !pills.length;
  const n = state.cats.size + (rangeSet() ? 1 : 0);
  $("fCount").textContent = ` (${n})`; $("fCount").hidden = !n;
}
function render() {
  let list = ITEMS.filter(i => inCats(i) && inPrice(i));
  if (state.sort === "low") list = [...list].sort((a, b) => (a.price ?? 1e9) - (b.price ?? 1e9));
  if (state.sort === "high") list = [...list].sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
  if (state.sort === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  $("grid").innerHTML = list.map(i => `
    <a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">
      <div class="photo">${i.img ? `<img class="${i.fit}" src="photos/${i.img}.jpg" alt="" loading="lazy" width="720" height="720">` : `<span class="nophoto">${esc(i.store)}</span>`}</div>
      <div class="info">
        <span class="brand">${esc(i.store)}</span>
        <span class="name">${esc(i.name)}</span>
        ${i.price != null ? (i.was ? `<span class="price"><span class="sale">${money(i.price)}</span><s>${money(i.was)}</s></span>` : `<span class="price">${money(i.price)}</span>`) : `<span class="meta">Price on Amazon</span>`}
        ${i.size ? `<span class="meta">${esc(SIZES[i.size])}</span>` : ""}
        ${i.tip ? `<span class="meta note">${esc(i.tip)}</span>` : ""}
      </div>
    </a>`).join("");
  $("empty").hidden = list.length > 0;
  $("resultCount").textContent = `${list.length} items`;
  $("applyBtn").textContent = `Show ${list.length}`;
  renderActive();
}

const panel = $("filterPanel"), fBtn = $("filterBtn");
const openPanel = o => { panel.hidden = !o; fBtn.setAttribute("aria-expanded", String(o)); };
fBtn.addEventListener("click", () => openPanel(panel.hidden));
$("applyBtn").addEventListener("click", () => openPanel(false));
document.addEventListener("click", e => {
  if (!panel.hidden && e.target.isConnected && !panel.contains(e.target) && !fBtn.contains(e.target)) openPanel(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) { openPanel(false); fBtn.focus(); } });

const clamp = v => Math.max(0, Math.min(PMAX, Math.round(v / 5) * 5));
panel.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.cat) {
    t.checked ? state.cats.add(t.dataset.cat) : state.cats.delete(t.dataset.cat);
    renderPrice();
  } else if (t.id === "pMinNum" || t.id === "pMaxNum") {
    let a = clamp(+$("pMinNum").value || 0), b = $("pMaxNum").value === "" ? PMAX : clamp(+$("pMaxNum").value);
    if (a > b) [a, b] = [b, a];
    state.min = a; state.max = b; renderPrice();
  }
  render();
});
$("pMin").addEventListener("input", e => { state.min = Math.min(+e.target.value, state.max); renderPrice(); render(); });
$("pMax").addEventListener("input", e => { state.max = Math.max(+e.target.value, state.min); renderPrice(); render(); });

function clearAll() { state.cats.clear(); state.min = 0; state.max = PMAX; renderFilters(); render(); }
$("clearBtn").addEventListener("click", clearAll);
$("active").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const { k, v } = b.dataset;
  if (k === "all") return clearAll();
  if (k === "cat") state.cats.delete(v);
  if (k === "price") { state.min = 0; state.max = PMAX; }
  renderFilters(); render();
});
$("sortBy").addEventListener("change", e => { state.sort = e.target.value; render(); });

renderFilters(); render();

(function () {
  const now = new Date(), y = now.getMonth() === 11 && now.getDate() > 25 ? now.getFullYear() + 1 : now.getFullYear();
  const days = Math.ceil((new Date(y, 11, 25) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  if (days === 0) { $("days").textContent = "Merry Christmas!"; $("daysLabel").hidden = true; }
  else { $("days").textContent = days; $("daysLabel").textContent = days === 1 ? "day to Christmas" : "days to Christmas"; }
  $("countdown").hidden = false;
})();
</script>
</body>
</html>
